<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Poker Texas Hold'em</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="screen-start" class="overlay">
    <div class="panel">
      <h1>♠ Poker Texas Hold'em ♥</h1>
      <p class="sub">Jogue contra a máquina</p>
      <div class="cfg-row">
        <label for="cfg-bots">Oponentes (bots)</label>
        <input type="range" id="cfg-bots" min="2" max="3" value="3">
        <span id="cfg-bots-val">3</span>
      </div>
      <div class="cfg-row">
        <label for="cfg-buyin">Fichas iniciais</label>
        <input type="range" id="cfg-buyin" min="200" max="5000" step="100" value="1000">
        <span id="cfg-buyin-val">1000</span>
      </div>
      <div class="cfg-row">
        <label for="cfg-bb">Big blind</label>
        <input type="range" id="cfg-bb" min="10" max="100" step="10" value="20">
        <span id="cfg-bb-val">20 (blinds 10/20)</span>
      </div>
      <button id="btn-start">Começar</button>
    </div>
  </div>

  <div id="game" class="hidden">
    <div id="stage">
      <div id="status"></div>
      <div id="table">
        <div id="pot"></div>
        <div id="board"></div>
      </div>
      <div id="players"></div>
    </div>
    <div id="actionbar">
      <div id="actions" class="hidden">
        <button id="btn-fold">Desistir</button>
        <button id="btn-check" class="hidden">Pagar (0)</button>
        <button id="btn-call" class="hidden">Pagar</button>
        <div id="raise-box" class="hidden">
          <span id="raise-val"></span>
          <input type="range" id="raise-slider" min="0" max="100">
          <button id="btn-raise">Aumentar</button>
        </div>
      </div>
      <button id="btn-next" class="hidden">Próxima mão</button>
    </div>
  </div>

  <div id="log"></div>

  <script src="game.js"></script>
  <script src="ui.js"></script>
</body>
</html>
